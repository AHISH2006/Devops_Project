# ─────────────────────────────────────────────────────────────
#  DevOps Project — Docker Compose
#  Runs: Frontend (NGINX) + Backend (Node.js) + Database (MongoDB)
#  Usage:
#    docker-compose up -d        → start all services
#    docker-compose down         → stop all services
#    docker-compose logs -f      → stream logs
#    docker-compose ps           → check status
# ─────────────────────────────────────────────────────────────

version: '3.8'

services:

  # ── Frontend (React built by Vite, served by NGINX) ─────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - devops-network

  # ── Backend (Node.js + Express REST API) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/physioDB
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-devops_jwt_secret_change_in_prod}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devops-network

  # ── Database (MongoDB) ───────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: devops-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - devops-network

# ── Volumes ──────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────
networks:
  devops-network:
    driver: bridge
